<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简单的网页设计</title>
</head>

<body bgcolor="#e0f7fa">

    <h1 align="center">我的网页作业</h1>

    <p align="center">
        <a href="#music_area">跳转到音乐</a> |
        <a href="#table_area">跳转到表格</a>
    </p>

    <h3>1. 网页链接</h3>
    <p>点击这里进入子页面：<a href="子页面.html">进入子页面</a></p>

    <h3>2. 网页修饰</h3>
    <p><font color="red" size="5">这是红色的字体修饰。</font></p>
    <marquee direction="left" bgcolor="yellow">这是一段滚动的文字，欢迎光临我的网页！</marquee>

    <h3>3. 图像与音乐</h3>
    <p>下面是一张图片：</p>
    <img src="8720.jpg_wh860.jpg" width="200" alt="网页作业配图">

    <p id="music_area">下面是背景音乐：</p>
    <audio src="M500002PRKPk3CZ6pc.mp3" controls loop>
        您的浏览器不支持音频播放。
    </audio>

    <h3 id="table_area">4. 表格</h3>
    <table border="1" width="300">
        <tr>
            <th>姓名</th>
            <th>科目</th>
        </tr>
        <tr>
            <td>小明</td>
            <td>网页设计</td>
        </tr>
    </table>

    <h3>5. 表单</h3>
    <form>
        用户名：<input type="text" name="username"><br><br>
        密&nbsp;&nbsp;&nbsp;码：<input type="password" name="pwd"><br><br>
        <input type="submit" value="提交">
    </form>

</body>
</html>
