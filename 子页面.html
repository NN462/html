<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>齐星贻的课程表</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #f4fbff;
            color: #333;
            font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
            line-height: 1.8;
        }
        header {
            background: #fff;
            text-align: center;
            padding: 22px 10px;
            border-bottom: 1px solid #d9e8ed;
        }
        header h1 {
            margin: 0 0 8px;
            color: #386c91;
            letter-spacing: 5px;
        }
        nav a {
            color: #3978a8;
            text-decoration: underline;
            margin: 0 8px;
        }
        main {
            width: min(1050px, calc(100% - 16px));
            margin: 12px auto 40px;
        }
        h2 {
            color: #315f8d;
            font-size: 17px;
            margin: 10px 0;
        }
        .table-box { overflow-x: auto; }
        table {
            width: 100%;
            min-width: 720px;
            border-collapse: collapse;
            background: #fff;
            text-align: center;
        }
        th, td {
            border: 1px solid #7aa7c2;
            padding: 12px 6px;
        }
        th, td:first-child { background: #edf7ff; }
        .tip {
            background: #fff6b4;
            border-left: 4px solid #e1bd32;
            padding: 12px;
        }
        .back {
            display: inline-block;
            color: #fff;
            background: #3978a8;
            text-decoration: none;
            border-radius: 6px;
            padding: 9px 16px;
            margin-top: 12px;
        }
        @media (max-width: 600px) {
            header h1 { font-size: 24px; }
        }
    </style>
</head>
<body>
    <header>
        <h1>我的课程表</h1>
        <nav>
            <a href="index.html">返回主页面</a>
            <a href="index.html#intro">个人简介</a>
            <a href="#course">课程表</a>
        </nav>
    </header>

    <main>
        <section id="course">
            <h2>通信工程大三课程表</h2>
            <div class="table-box">
                <table>
                    <tr>
                        <th>星期</th><th>第一节</th><th>第二节</th><th>下午实验 / 自习</th>
                    </tr>
                    <tr>
                        <td>周一</td><td>通信原理</td><td>信号与线性系统</td><td>整理笔记</td>
                    </tr>
                    <tr>
                        <td>周二</td><td>高频电子线路</td><td>通信原理</td><td>做作业</td>
                    </tr>
                    <tr>
                        <td>周三</td><td>数字信号处理</td><td>英语</td><td>实验课</td>
                    </tr>
                    <tr>
                        <td>周四</td><td>网页设计</td><td>通信原理</td><td>复习</td>
                    </tr>
                    <tr>
                        <td>周五</td><td>体育</td><td>自习</td><td>整理学习资料</td>
                    </tr>
                </table>
            </div>
        </section>

        <h2>学习提示</h2>
        <p class="tip">课前预习，课后复习，把作业和实验安排写在笔记本里。</p>
        <a class="back" href="index.html">返回主页面</a>
    </main>
</body>
</html>
